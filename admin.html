<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Admin Dashboard</h1>

    <section>
        <h2>Student Information</h2>

        <div id="adminStudentDetails">
            <p>Loading student details...</p>
        </div>
    </section>

    <section>
        <h2>Fees Information</h2>

        <p><strong>Total Course Fees:</strong> ₹11,60,000</p>
        <p><strong>Paid Fees:</strong> ₹4,35,000</p>
        <p><strong>Remaining Fees:</strong> ₹7,25,000</p>
    </section>

    <script>
        const data = JSON.parse(localStorage.getItem("studentData"));

        if (data) {
            document.getElementById("adminStudentDetails").innerHTML = `
                <p><strong>Name:</strong> ${data.name}</p>
                <p><strong>Father's Name:</strong> ${data.fatherName}</p>
                <p><strong>Mobile:</strong> ${data.mobile}</p>
                <p><strong>Email:</strong> ${data.email}</p>
                <p><strong>Course:</strong> ${data.course}</p>
                <p><strong>Branch:</strong> ${data.branch}</p>
                <p><strong>Admission Date:</strong> ${data.admissionDate}</p>
            `;
        } else {
            document.getElementById("adminStudentDetails").innerHTML =
                "<p>No student data found.</p>";
        }
    </script>

</body>
</html>
